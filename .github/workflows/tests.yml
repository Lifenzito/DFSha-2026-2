name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=evidence/pytest-ci.xml
      - name: Conservar evidencia de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: evidence/pytest-ci.xml

